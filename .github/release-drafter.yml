change-template: "- #$NUMBER - $TITLE (@$AUTHOR)"
categories:
  - title: "⚠ Breaking Changes"
    labels:
      - "breaking-change"
  - title: "⬆️ Dependencies"
    collapse-after: 1
    labels:
      - "dependencies"
  - type: 'pre-exclude'
    when:
      label: 'skip-changelog'
template: |
  ## What’s Changed

  $CHANGES
